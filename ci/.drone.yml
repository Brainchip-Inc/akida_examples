kind: pipeline
name: check-style

trigger:
  ref:
    include:
    - refs/pull/**
    - refs/tags/**
    - refs/heads/main

platform:
  os: linux
  arch: amd64

defs:
  image: &image bender:5000/doc_build:ed241d5

steps:
- name: report host name
  image: *image
  commands:
  - printenv DRONE_STAGE_MACHINE

- name: flake8
  image: *image
  commands:
  - flake8 --ignore E402,E501 examples/
  # refer to https://flake8.pycqa.org/en/2.6.0/warnings.html for error codes
  # E402: module level import not at top of file
  # E501: line too long

- name: link checks
  image: *image
  environment:
    UV_EXTRA_INDEX_URL: http://bender2.brainchipinc.local:81/
    UV_INSECURE_HOST: bender2.brainchipinc.local
  commands:
  - uv pip install --system -r requirements.txt
  - sphinx-build -j auto -D plot_gallery=0 -b html ./doc ./build -b linkcheck

---
kind: pipeline
name: build-doc

trigger:
  ref:
    include:
    - refs/pull/**
    - refs/tags/**
    - refs/heads/main

platform:
  os: linux
  arch: amd64

defs:
  image: &image bender:5000/doc_build:ed241d5

steps:
- name: report host name
  image: *image
  commands:
  - printenv DRONE_STAGE_MACHINE

- name: check device and GPU
  image: *image
  privileged: true
  commands:
  - pip install akida --index-url http://bender2.brainchipinc.local:81/ --trusted-host bender2.brainchipinc.local
  - sh ./ci/test_devices.sh
  volumes:
    - name: akida_chip
      path: /dev/akida0

- name: build
  image: *image
  privileged: true
  environment:
    UV_EXTRA_INDEX_URL: http://bender2.brainchipinc.local:81/
    UV_INSECURE_HOST: bender2.brainchipinc.local
  commands:
  - uv pip install --system -r requirements.txt
  - uv cache prune --ci
  # on PR builds only:
  # reuse datasets/pretrained weights fetched by previous builds
  # (fetch_file caches under ~/.keras/datasets).
  - if [ "$DRONE_BUILD_EVENT" = "pull_request" ]; then mkdir -p /root/.keras && ln -snf /var/cache/keras-datasets /root/.keras/datasets; fi
  # on PR builds, use the git diff against the target branch to decide which examples to execute:
  # - requirements.txt changed -> execute all examples
  # - otherwise -> execute only the changed examples (sphinx-gallery filename_pattern override);
  #   the other examples are still rendered in the gallery, just not executed. If no example
  #   changed, skip execution entirely (plot_gallery=0).
  # If the diff cannot be computed, or on any other event (main/tag), all examples are executed
  # (GALLERY_OPTS stays empty).
  - |
    GALLERY_OPTS=""
    if [ "$DRONE_BUILD_EVENT" = "pull_request" ]; then
      if git fetch --no-tags origin "$DRONE_TARGET_BRANCH" && CHANGED=$(git diff --name-only "FETCH_HEAD...HEAD"); then
        echo "Files changed in PR:"
        echo "$CHANGED"
        if ! echo "$CHANGED" | grep -qx "requirements.txt"; then
          PATTERN=$(echo "$CHANGED" | grep '^examples/.*\.py$' | sed 's|.*/||; s|\.py$||' | paste -sd "|" -)
          if [ -n "$PATTERN" ]; then
            GALLERY_OPTS="-D sphinx_gallery_conf.filename_pattern=($PATTERN)\.py"
          else
            GALLERY_OPTS="-D plot_gallery=0"
          fi
        fi
      else
        echo "Could not diff against $DRONE_TARGET_BRANCH, executing all examples"
      fi
    fi
  - sphinx-build -j auto -D plot_gallery=1 -b html ./doc ./build $GALLERY_OPTS
  volumes:
    - name: akida_chip
      path: /dev/akida0
    - name: uv_cache
      path: /root/.cache/uv
    - name: keras_datasets_cache
      path: /var/cache/keras-datasets

- name: update_gh_pages
  image: bender:5000/drone/git:linux
  when:
    ref:
      exclude:
      - refs/pull/**
    cron:
      exclude:
      - nightly
  commands:
  - git fetch
  - git checkout gh-pages
  - git clean -xf
  - cd beta/
  - rm -rf _* examples/ api_reference/ user_guide/
  - rm *.html *.inv *.js
  - cp -R ../build/* .
  - rm -rf _sources/
  - cd ..
  - rm -Rf doc/ build/
  - git add .
  - git diff --quiet && git diff --staged --quiet || git commit -am "Automated - Push to beta"
  - git push origin gh-pages

- name: promote_beta_to_prod
  image: bender:5000/drone/git:linux
  when:
    ref:
      include:
      - refs/tags/**
    event:
      - tag
  commands:
  - git fetch
  - git checkout gh-pages
  - git clean -xf
  - rm -rf _* examples/ api_reference/ user_guide/
  - rm -f *.html *.inv *.js
  - cp -R beta/* .
  - rm -Rf doc/ build/
  - git add .
  - git diff --quiet && git diff --staged --quiet || git commit -am 'Automated - Promote beta to prod [tag:${DRONE_TAG}]'
  - git push origin gh-pages

volumes:
- name: akida_chip
  host:
    path: /dev/akida0
- name: uv_cache
  host:
    path: /var/cache/drone/uv
- name: keras_datasets_cache
  host:
    path: /var/cache/drone/keras-datasets

node:
  hw: gpu-nsoc_v2

depends_on:
  - check-style

---

# This pipeline runs examples using the latest internal RC versions of
# akida/cnn2snn/akida_models, available on bender2
kind: pipeline
name: run-examples-latest-versions

trigger:
  cron:
    - nightly

platform:
  os: linux
  arch: amd64

defs:
  image: &image bender:5000/doc_build:ed241d5

steps:
- name: report host name
  image: *image
  commands:
  - printenv DRONE_STAGE_MACHINE

- name: check device and GPU
  image: *image
  privileged: true
  commands:
  - pip install akida --index-url http://bender2.brainchipinc.local:81/ --trusted-host bender2.brainchipinc.local
  - sh ./ci/test_devices.sh
  volumes:
    - name: akida_chip
      path: /dev/akida0

- name: build
  image: *image
  privileged: true
  environment:
    UV_EXTRA_INDEX_URL: http://bender2.brainchipinc.local:81/
    UV_INSECURE_HOST: bender2.brainchipinc.local
  commands:
  - uv pip install --system -r requirements.txt
  - uv pip install --system --pre -U cnn2snn akida_models
  - uv cache prune --ci
  - sphinx-build -j auto -D plot_gallery=1 -b html ./doc ./build
  volumes:
    - name: akida_chip
      path: /dev/akida0
    - name: uv_cache
      path: /root/.cache/uv

volumes:
- name: akida_chip
  host:
    path: /dev/akida0
- name: uv_cache
  host:
    path: /var/cache/drone/uv

node:
  hw: gpu-nsoc_v2
